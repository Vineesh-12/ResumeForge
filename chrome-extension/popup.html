<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumeForge AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="brand-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div>
        <h2>ResumeForge</h2>
        <span class="badge-free">100% FREE</span>
      </div>
    </div>

    <p class="popup-subtitle">
      Extract the job description from this page and tailor your Harvard-Jake ATS resume in 1 click.
    </p>

    <div id="status-box" class="status-box" style="display: none;"></div>

    <button id="btn-extract" class="btn-primary">
      <span>🚀 Extract Job &amp; Tailor Resume</span>
    </button>

    <button id="btn-open-app" class="btn-secondary">
      <span>Open ResumeForge App</span>
    </button>

    <div class="popup-footer">
      <span>Supported: LinkedIn • Indeed • Greenhouse • Lever</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
